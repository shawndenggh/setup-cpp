name: Set up C/C++ toolchain
description: Install Ubuntu C/C++ tools or only make with an optional APT mirror

inputs:
  mirror:
    description: Ubuntu archive URL (including /ubuntu or /ubuntu-ports); empty uses the runner's APT sources
    required: false
    default: ''
  make-only:
    description: Install and verify only make, without GCC, G++ or development headers
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install and verify build tools
      shell: bash
      env:
        SETUP_CPP_MIRROR: ${{ inputs.mirror }}
        SETUP_CPP_MAKE_ONLY: ${{ inputs.make-only }}
        SETUP_CPP_ACTION_PATH: ${{ github.action_path }}
      run: bash "$SETUP_CPP_ACTION_PATH/setup.sh"
